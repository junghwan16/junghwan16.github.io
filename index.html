<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Games</title>
<meta name="description" content="Godot로 만든 작은 웹 게임 모음">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #11141b;
    --card: #1c2029;
    --card-hover: #232833;
    --text: #f2f2f5;
    --muted: #9aa1b0;
    --accent: #ffcc66;
    --chip: #2a2f3b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.55;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    font-size: clamp(36px, 7vw, 56px);
    margin: 0;
    color: var(--accent);
    letter-spacing: 0.5px;
  }
  header p { margin: 6px 0 0; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 20px;
    margin-top: 36px;
  }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 16px;
    overflow: hidden;
    color: inherit;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-3px); background: var(--card-hover); outline: none; }
  .cover { aspect-ratio: 16 / 9; width: 100%; object-fit: cover; display: block; background: #0b0d12; }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 24px; margin: 0; }
  .desc { margin: 0; color: var(--muted); font-size: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--chip); color: var(--muted); font-size: 12px; padding: 3px 9px; border-radius: 999px; }
  .meta { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 6px; font-size: 13px; color: var(--muted); }
  .play {
    font-family: "Fredoka", sans-serif;
    font-weight: 600;
    background: var(--accent);
    color: #2a1c0a;
    padding: 6px 16px;
    border-radius: 10px;
  }
  .empty { color: var(--muted); margin-top: 36px; }
  footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mini Games</h1>
    <p>Godot로 만들고 있는 작은 웹 게임들. PC와 모바일 브라우저에서 바로 플레이할 수 있어요.</p>
  </header>

  <main id="games" class="grid" aria-live="polite"></main>

  <footer>
    Made with <a href="https://godotengine.org">Godot Engine</a> · 각 게임의 에셋 출처는 게임 폴더의 CREDITS를 참고하세요.
  </footer>
</div>

<script>
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  fetch("games.json", { cache: "no-cache" })
    .then((r) => r.json())
    .then((games) => {
      const root = document.getElementById("games");
      if (!games.length) {
        root.outerHTML = '<p class="empty">아직 게임이 없어요.</p>';
        return;
      }
      games.sort((a, b) => (b.added || "").localeCompare(a.added || ""));
      root.innerHTML = games.map((g) => `
        <a class="card" href="${esc(g.slug)}/">
          <img class="cover" src="${esc(g.slug)}/cover.jpg" alt="${esc(g.title)} 스크린샷" loading="lazy">
          <div class="body">
            <h2 class="title">${esc(g.title)}</h2>
            <p class="desc">${esc(g.description)}</p>
            <div class="chips">${(g.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
            <div class="meta">
              <span>${esc(g.controls || "")}</span>
              <span class="play">PLAY</span>
            </div>
          </div>
        </a>`).join("");
    })
    .catch(() => {
      document.getElementById("games").outerHTML = '<p class="empty">게임 목록을 불러오지 못했어요.</p>';
    });
</script>
</body>
</html>
